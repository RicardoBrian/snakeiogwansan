<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>SNAKE.IO</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="common.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="game"></canvas>

<div id="hud" class="hidden">
  <div id="stats"><span id="scoreText"></span><span id="killText"></span><span id="onlineText"></span><span id="boostText" class="on"></span></div>
  <div id="board"><h3 data-i18n="board"></h3><ol id="boardList"></ol></div>
  <canvas id="minimap" width="150" height="150"></canvas>
  <div id="help"></div>
  <button id="boostBtn" type="button" aria-label="Boost">⚡</button>
</div>

<div id="toast"></div>

<div id="login" class="overlay">
  <div class="card">
    <h1>🐍 SNAKE.IO</h1>
    <p class="sub" data-i18n="subtitle"></p>
    <form id="loginForm" autocomplete="off">
      <input id="sidInput" data-i18n-ph="sidPh" maxlength="12" inputmode="numeric" required>
      <input id="nameInput" data-i18n-ph="namePh" maxlength="10" required>
      <button id="joinBtn" type="submit" data-i18n="join"></button>
    </form>
    <p id="loginError" class="error"></p>
    <p id="connText" class="muted"></p>
    <div class="fame">
      <h3 data-i18n="fameTitle"></h3>
      <ol id="fameList"></ol>
    </div>
  </div>
</div>

<div id="dead" class="overlay hidden">
  <div class="card">
    <h1 id="deadTitle"></h1>
    <p id="deadMsg" class="sub"></p>
    <div class="result">
      <div><b id="deadScore">0</b><span data-i18n="peakLabel"></span></div>
      <div><b id="deadKills">0</b><span data-i18n="killsLabel"></span></div>
      <div><b id="deadBest">-</b><span data-i18n="bestLabel"></span></div>
    </div>
    <button id="retryBtn" data-i18n="retry"></button>
    <button id="homeBtn" class="ghost" data-i18n="home"></button>
    <p id="deadError" class="error"></p>
  </div>
</div>

<script src="i18n.js"></script>
<script src="lib/firebase-app-compat.js"></script>
<script src="lib/firebase-database-compat.js"></script>
<script src="api/config"></script>
<script src="game.js"></script>
</body>
</html>
