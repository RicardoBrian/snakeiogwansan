<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>관산 게임왕 · 컴퓨터실 화면</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: "Noto Sans KR", system-ui, sans-serif; }
  iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; visibility: hidden; }
  iframe.on { visibility: visible; }
  .toast {
    position: fixed; left: 50%; top: 24px; transform: translateX(-50%); z-index: 3;
    padding: 10px 26px; border-radius: 99px; background: rgba(30, 22, 15, .92); color: #f4e7c8;
    border: 2px solid #e3b341; font-size: 22px; font-weight: 900; opacity: 0; transition: opacity .3s;
  }
  .toast.show { opacity: 1; }
  .help {
    position: fixed; right: 16px; bottom: 16px; z-index: 3; display: flex; gap: 8px; align-items: center;
    padding: 8px 10px; border-radius: 12px; background: rgba(30, 22, 15, .92); border: 2px solid #5a4430;
    color: #f4e7c8; font-size: 15px; font-weight: 700; transition: opacity .5s;
  }
  .help kbd { padding: 1px 8px; border-radius: 6px; background: #f4e7c8; color: #2a1d12; font: 900 15px system-ui, sans-serif; }
  .help button { padding: 6px 12px; border-radius: 8px; border: 0; background: #e3b341; color: #2a1d12; font: 900 15px system-ui, sans-serif; cursor: pointer; }
  body.idle .help { opacity: 0; pointer-events: none; }
  body.idle { cursor: none; }
</style>
</head>
<body>
<iframe id="v0" title="전광판" data-src="board"></iframe>
<iframe id="v1" title="1부 안내" data-src="part1"></iframe>
<iframe id="v2" title="2부 안내" data-src="part2"></iframe>
<div class="toast" id="toast"></div>
<div class="help" id="help">
  <span><kbd>0</kbd> 전광판</span><span><kbd>1</kbd> 1부</span><span><kbd>2</kbd> 2부</span>
  <button type="button" id="fsBtn">⛶ 전체 화면</button>
</div>
<script>
(function () {
  'use strict';
  const NAMES = { 0: '전광판', 1: '1부 안내', 2: '2부 안내' };
  const frames = [0, 1, 2].map(i => document.getElementById('v' + i));
  // 주소 뒤 ?room=1234, ?time=09:40 등은 각 화면에 그대로 전달
  frames.forEach(f => { f.src = f.dataset.src + location.search; });

  const toast = document.getElementById('toast');
  let toastTimer = 0, current = -1;
  function show(n) {
    n = Number(n);
    if (!(n in NAMES)) return;
    frames.forEach((f, i) => f.classList.toggle('on', i === n));
    if (n !== current) {
      current = n;
      toast.textContent = NAMES[n];
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 1200);
    }
    history.replaceState(null, '', '#' + n);
    window.focus();
  }

  document.addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key in NAMES) { e.preventDefault(); show(e.key); }
  });
  // 화면 안을 클릭해 포커스가 iframe으로 가도 키가 먹도록
  window.addEventListener('message', e => {
    if (e.origin === location.origin && e.data && 'gkView' in e.data) show(e.data.gkView);
  });

  document.getElementById('fsBtn').addEventListener('click', () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
  });
  let idle = 0;
  const wake = () => { document.body.classList.remove('idle'); clearTimeout(idle); idle = setTimeout(() => document.body.classList.add('idle'), 3000); };
  ['mousemove', 'keydown'].forEach(ev => document.addEventListener(ev, wake));
  wake();

  show((location.hash || '#0').slice(1) || 0);
})();
</script>
</body>
</html>
