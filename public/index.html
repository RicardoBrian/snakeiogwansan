<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>SNAKE.IO</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="common.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="game"></canvas>

<div id="hud" class="hidden">
  <div id="stats"><span id="roundText" class="hidden"></span><span id="scoreText"></span><span id="killText"></span><span id="onlineText"></span><span id="boostText" class="on"></span></div>
  <div id="board"><h3 data-i18n="board"></h3><ol id="boardList"></ol></div>
  <canvas id="minimap" width="150" height="150"></canvas>
  <div id="help"></div>
  <button id="boostBtn" type="button" aria-label="Boost">⚡</button>
</div>

<div id="toast"></div>

<div id="login" class="overlay">
  <div class="card">
    <h1>🐍 SNAKE.IO</h1>
    <p class="sub" data-i18n="subtitle"></p>
    <form id="loginForm" autocomplete="off">
      <input id="codeInput" data-i18n-ph="codePh" maxlength="4" inputmode="numeric" class="code-input">
      <input id="sidInput" data-i18n-ph="sidPh" maxlength="12" inputmode="numeric">
      <input id="nameInput" data-i18n-ph="namePh" maxlength="10">
      <button id="joinBtn" type="submit" data-i18n="joinRoom"></button>
      <button id="practiceBtn" type="button" class="ghost" data-i18n="practice"></button>
    </form>
    <p id="loginError" class="error"></p>
    <p id="connText" class="muted"></p>
    <div class="fame">
      <h3 data-i18n="fameTitle"></h3>
      <ol id="fameList"></ol>
    </div>
  </div>
</div>

<div id="dead" class="overlay hidden">
  <div class="card">
    <h1 id="deadTitle"></h1>
    <p id="deadMsg" class="sub"></p>
    <div class="result">
      <div><b id="deadScore">0</b><span data-i18n="peakLabel"></span></div>
      <div><b id="deadKills">0</b><span data-i18n="killsLabel"></span></div>
      <div><b id="deadBest">-</b><span id="deadBestLabel" data-i18n="bestLabel"></span></div>
    </div>
    <button id="retryBtn" data-i18n="retry"></button>
    <button id="homeBtn" class="ghost" data-i18n="home"></button>
    <p id="deadError" class="error"></p>
  </div>
</div>

<div id="roomPanel" class="overlay hidden">
  <div class="card wide">
    <div class="room-head"><span id="rpName"></span><span id="rpCode" class="code-chip"></span></div>
    <h1 id="rpTitle"></h1>
    <p id="rpSub" class="sub"></p>
    <div id="rpMine" class="result hidden">
      <div><b id="rpMyRank">-</b><span data-i18n="roundRank"></span></div>
      <div><b id="rpMyPts">-</b><span data-i18n="ptsEarned"></span></div>
      <div><b id="rpMyTotal">-</b><span data-i18n="totalPts"></span></div>
    </div>
    <div id="readyBox" class="ready-box hidden">
      <button id="readyBtn" type="button"></button>
      <p id="readyText" class="muted"></p>
    </div>
    <div class="tables">
      <div id="rpRoundBox" class="hidden"><h3 id="rpRoundTitle"></h3><table id="rpRound"></table></div>
      <div id="rpTotalBox" class="hidden"><h3 data-i18n="standings"></h3><table id="rpTotal"></table></div>
    </div>
    <button id="leaveBtn" class="ghost" data-i18n="leaveRoom"></button>
  </div>
</div>

<div id="countdown" class="hidden"><div id="countdownSub"></div><div id="countdownNum"></div></div>

<script src="i18n.js"></script>
<script src="lib/firebase-app-compat.js"></script>
<script src="lib/firebase-database-compat.js"></script>
<script src="api/config"></script>
<script src="game.js"></script>
</body>
</html>
