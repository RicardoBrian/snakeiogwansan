<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SNAKE.IO Admin</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="common.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #0b0f17; color: #e8ecf4; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 16px; }
  .scroll { overflow-x: auto; }
  h1 { padding-right: 200px; }
  @media (max-width: 600px) { h1 { padding-right: 0; margin-top: 36px; font-size: 24px; } }
  h1 { margin: 0 0 16px; }
  h2 { margin: 0 0 10px; font-size: 18px; }
  .panel { background: #161d2b; border: 1px solid #2a3550; border-radius: 14px; padding: 18px; margin-bottom: 16px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .grid { display: grid; grid-template-columns: 1fr 1.6fr; gap: 16px; }
  @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }
  button { padding: 10px 16px; border: 0; border-radius: 9px; font-weight: bold; font-size: 15px; cursor: pointer; background: #334155; color: #fff; }
  button.go { background: #22c55e; color: #05210f; }
  button.stop { background: #ef4444; }
  button.on { outline: 2px solid #fbbf24; }
  input { padding: 10px 12px; border-radius: 9px; border: 1px solid #33405e; background: #0f1522; color: #fff; font-size: 15px; }
  table { width: 100%; border-collapse: collapse; font-size: 15px; }
  th, td { padding: 7px 8px; border-bottom: 1px solid #253049; text-align: left; }
  th { color: #9aa7c2; font-weight: normal; }
  th.num, td.num { text-align: right; font-variant-numeric: tabular-nums; }
  tr.top1 td { color: #fbbf24; font-weight: bold; }
  tr.top2 td { color: #e5e7eb; font-weight: bold; }
  tr.top3 td { color: #d6a36a; font-weight: bold; }
  #status { font-size: 18px; font-weight: bold; }
  .muted { color: #6f7c98; font-size: 13px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <h1 data-i18n="adminTitle"></h1>

  <div id="gate" class="panel">
    <h2 data-i18n="pwTitle"></h2>
    <form id="gateForm" class="row">
      <input id="pw" type="password" data-i18n-ph="pwPh" autofocus>
      <button class="go" type="submit" data-i18n="signIn"></button>
      <span id="gateErr" style="color:#ff7676"></span>
    </form>
  </div>

  <div id="main" class="hidden">
    <div class="panel">
      <div class="row">
        <span id="status" data-i18n="statusChecking"></span>
        <span style="flex:1"></span>
        <button id="openBtn" class="go" data-i18n="startRound"></button>
        <button id="lockBtn" class="stop" data-i18n="endRound"></button>
      </div>
      <p class="muted" data-i18n="roundHint"></p>
    </div>

    <div class="grid">
      <div class="panel">
        <h2><span data-i18n="livePlayers"></span> <span id="liveCount" class="muted"></span></h2>
        <div class="scroll"><table><thead><tr><th>#</th><th data-i18n="colSid"></th><th data-i18n="colName"></th><th class="num" data-i18n="colScore"></th></tr></thead><tbody id="liveBody"></tbody></table></div>
      </div>
      <div class="panel">
        <div class="row" style="margin-bottom:10px">
          <h2 style="margin:0" data-i18n="ranking"></h2>
          <span style="flex:1"></span>
          <button id="sortBest" class="on" data-i18n="sortBest"></button>
          <button id="sortKills" data-i18n="sortKills"></button>
          <button id="csvBtn" data-i18n="csv"></button>
        </div>
        <div class="scroll"><table><thead><tr><th data-i18n="colRank"></th><th data-i18n="colSid"></th><th data-i18n="colName"></th><th class="num" data-i18n="colBest"></th><th class="num" data-i18n="colKills"></th><th class="num" data-i18n="colGames"></th></tr></thead><tbody id="rankBody"></tbody></table></div>
      </div>
    </div>

    <div class="panel">
      <h2 data-i18n="manage"></h2>
      <div class="row">
        <button id="clearFood" data-i18n="clearFood"></button>
        <button id="clearScores" class="stop" data-i18n="resetScores"></button>
      </div>
      <p class="muted" data-i18n="resetHint"></p>
    </div>
  </div>
</div>

<script src="i18n.js"></script>
<script src="lib/firebase-app-compat.js"></script>
<script src="lib/firebase-database-compat.js"></script>
<script src="api/config"></script>
<script src="admin.js"></script>
</body>
</html>
