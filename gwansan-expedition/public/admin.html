<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>탐사대 장부</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="admin.css">
</head>
<body>
<header class="topbar">
  <span class="topbar-title">🔐 탐사대 장부 (관리자)</span>
  <span class="place-chip">📍 컴퓨터실</span>
</header>

<main class="admin">
  <section id="loginBox" class="card">
    <h2 class="card-title">관리자 로그인</h2>
    <p>관리자로 지정된 Google 계정만 신청 목록을 볼 수 있습니다.</p>
    <button type="button" id="signIn" class="btn">Google 계정으로 로그인</button>
    <p class="err" id="loginMsg" role="alert"></p>
  </section>

  <section id="board" hidden>
    <div class="admin-bar">
      <span id="who"></span>
      <button type="button" id="signOut" class="btn btn-ghost btn-small">로그아웃</button>
    </div>

    <div class="stats" id="stats"></div>

    <div class="card">
      <div class="admin-tools">
        <label>종목 <select id="filter"><option value="">전체</option></select></label>
        <label><input type="checkbox" id="onlyOverlap"> 같은 부 중복만</label>
        <input type="search" id="search" placeholder="이름/학번 검색" aria-label="이름 또는 학번 검색">
        <button type="button" id="csvBtn" class="btn btn-small">CSV 저장</button>
      </div>
      <p class="hint">⚠ 표시: 같은 부(시간대) 두 종목을 모두 신청 → 한 종목만 선정 가능</p>
      <div class="table-wrap">
        <table>
          <thead><tr><th>#</th><th>학번</th><th>이름</th><th>종목</th><th>신청 시각</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <p class="err" id="boardMsg" role="alert"></p>
    </div>
  </section>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="shared.js"></script>
<script src="admin.js"></script>
</body>
</html>
