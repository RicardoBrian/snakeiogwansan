<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game Admin</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="fonts/fonts.css?v=20261020c">
<link rel="stylesheet" href="common.css?v=20261020c">
<link rel="stylesheet" href="admin.css?v=20261020d">
</head>
<body>

<!-- ===== 로그인 ===== -->
<div id="gate" class="gate">
  <h1 data-i18n="adminTitle"></h1>
  <div class="panel">
    <h2 data-i18n="loginTitle"></h2>
    <div class="row">
      <button id="googleBtn" class="go big" type="button" data-i18n="googleSignIn"></button>
      <button id="gateSignOut" class="ghost hidden" type="button" data-i18n="signOut"></button>
    </div>
    <p id="gateErr" class="error"></p>
    <p class="muted" data-i18n="loginHint"></p>
  </div>
</div>

<!-- ===== 관리 화면: 왼쪽 게임 메뉴 + 게임별 화면 =====
     새 게임 추가: 아래에 <section class="game" data-game="아이디"> 를 만들고, 그 게임의 *-admin.js 에서 Admin.register(...) -->
<div id="main" class="shell hidden">
  <nav class="side">
    <div class="brand" data-i18n="adminTitle"></div>
    <div class="side-label" data-i18n="navGames"></div>
    <div id="gameNav"></div>
    <div class="side-foot">
      <span id="whoText" class="who"></span>
      <button id="signOutBtn" class="ghost small" type="button" data-i18n="signOut"></button>
    </div>
  </nav>

  <main class="main">
    <!-- 게임 이름, 학생 주소, 하위 탭은 admin.js 가 채움 -->
    <div class="game-head">
      <span id="gameTitle" class="game-title"></span>
      <span class="url-chip"><span data-i18n="studentUrl"></span> <code id="gameUrl"></code>
        <button id="gameUrlCopy" type="button" data-i18n="copy"></button>
        <button id="gameUrlOpen" type="button" class="ghost" data-i18n="openPage"></button>
      </span>
    </div>
    <div id="subtabs" class="subtabs"></div>

    <!-- ================= 🐍 뱀 게임 ================= -->
    <section class="game" data-game="snake">
      <!-- 대회 (게임방) -->
      <div data-view="rooms">
        <div class="split">
          <aside class="list-pane">
            <button id="sNewBtn" class="go new-btn" type="button" data-i18n="sNew"></button>
            <div id="roomCards" class="cards"></div>
            <p id="noRooms" class="muted" data-i18n="noRooms"></p>
          </aside>
          <div>
            <div id="sEmpty" class="empty-state" data-i18n="pickHint"></div>

            <div id="sCreate" class="panel hidden">
              <h2 data-i18n="createTitle"></h2>
              <form id="createForm" class="form">
                <label><span data-i18n="fName"></span><input id="fName" maxlength="30" required></label>
                <label><span data-i18n="fRounds"></span><input id="fRounds" type="number" min="1" max="20" value="5" required></label>
                <label><span data-i18n="fDuration"></span><input id="fDuration" type="number" min="0.5" max="30" step="0.5" value="3" required></label>
                <label><span data-i18n="fPoints"></span><input id="fPoints" value="25,18,15,12,10,8,6,4,2,1" required></label>
                <label><span data-i18n="fKillBonus"></span><input id="fKillBonus" type="number" min="0" max="10" value="0" required></label>
              </form>
              <div class="row">
                <button class="go" type="submit" form="createForm" data-i18n="createBtn"></button>
                <button id="sCreateCancel" class="ghost" type="button" data-i18n="cancel"></button>
              </div>
              <p class="muted" data-i18n="pointsHint"></p>
            </div>

            <div id="detail" class="panel hidden">
              <div class="detail-head">
                <div class="code-box">
                  <div class="muted" data-i18n="joinCode"></div>
                  <div id="dCode" class="big-code"></div>
                </div>
                <div style="flex:1; min-width: 200px">
                  <div class="row"><span id="dName" class="detail-title"></span><span id="dBadge" class="badge"></span></div>
                  <div id="dInfo" class="muted"></div>
                </div>
                <div id="dTimer" class="timer"></div>
              </div>
              <ol id="sSteps" class="steps"></ol>
              <div class="next">
                <div class="next-label" data-i18n="nextLabel"></div>
                <div id="dPhase" class="next-text"></div>
                <div class="row">
                  <button id="startRoundBtn" class="go big"></button>
                  <button id="endNowBtn" class="stop big" data-i18n="endNow"></button>
                  <button id="finishBtn" class="hidden" data-i18n="finishNow"></button>
                </div>
              </div>
              <div class="row tools">
                <button id="sLinkBtn" class="ghost" data-i18n="copyJoinLink"></button>
                <button id="boardBtn" class="ghost" data-i18n="openBoard"></button>
                <button id="roomCsvBtn" class="ghost" data-i18n="csv"></button>
                <span class="spacer"></span>
                <button id="sDeleteBtn" class="danger-ghost small" data-i18n="delete"></button>
              </div>
              <p class="muted" data-i18n="autoHint"></p>

              <div class="cols section">
                <div>
                  <h2 id="liveTitle"></h2>
                  <div class="scroll"><table>
                    <thead><tr><th>#</th><th data-i18n="colSid"></th><th data-i18n="colName"></th><th class="num" data-i18n="colBest"></th><th class="num" data-i18n="colKills"></th></tr></thead>
                    <tbody id="liveRoundBody"></tbody>
                  </table></div>
                </div>
                <div>
                  <h2 data-i18n="standings"></h2>
                  <div class="scroll"><table>
                    <thead id="standHead"></thead>
                    <tbody id="standBody"></tbody>
                  </table></div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- 연습 모드 -->
      <div data-view="practice">
        <div class="panel">
          <div class="row">
            <span id="status" data-i18n="statusChecking"></span>
            <span class="spacer"></span>
            <button id="openBtn" class="go" data-i18n="startRound"></button>
            <button id="lockBtn" class="stop" data-i18n="endRound"></button>
          </div>
          <p class="muted" data-i18n="roundHint"></p>
        </div>
        <div class="cols">
          <div class="panel">
            <h2><span data-i18n="livePlayers"></span> <span id="liveCount" class="muted"></span></h2>
            <div class="scroll"><table><thead><tr><th>#</th><th data-i18n="colSid"></th><th data-i18n="colName"></th><th class="num" data-i18n="colScore"></th></tr></thead><tbody id="liveBody"></tbody></table></div>
          </div>
          <div class="panel">
            <div class="row" style="margin-bottom:10px">
              <h2 style="margin:0" data-i18n="ranking"></h2>
              <span class="spacer"></span>
              <button id="sortBest" class="small on" data-i18n="sortBest"></button>
              <button id="sortKills" class="small" data-i18n="sortKills"></button>
              <button id="csvBtn" class="small ghost" data-i18n="csv"></button>
            </div>
            <div class="scroll"><table><thead><tr><th data-i18n="colRank"></th><th data-i18n="colSid"></th><th data-i18n="colName"></th><th class="num" data-i18n="colBest"></th><th class="num" data-i18n="colKills"></th><th class="num" data-i18n="colGames"></th></tr></thead><tbody id="rankBody"></tbody></table></div>
          </div>
        </div>
        <div class="panel">
          <h2 data-i18n="manage"></h2>
          <div class="row">
            <button id="clearFood" class="ghost" data-i18n="clearFood"></button>
            <button id="clearScores" class="danger-ghost" data-i18n="resetScores"></button>
          </div>
          <p class="muted" data-i18n="resetHint"></p>
        </div>
      </div>
    </section>

    <!-- ================= ⚫ 오목 ================= -->
    <section class="game" data-game="omok">
      <div data-view="leagues">
        <div class="split">
          <aside class="list-pane">
            <button id="oNewBtn" class="go new-btn" type="button" data-i18n="oNew"></button>
            <div id="oCards" class="cards"></div>
            <p id="oNoLeagues" class="muted" data-i18n="oNoLeagues"></p>
          </aside>
          <div>
            <div id="oEmpty" class="empty-state" data-i18n="pickHint"></div>

            <div id="oCreate" class="panel hidden">
              <h2 data-i18n="oCreateTitle"></h2>
              <form id="oCreateForm" class="form">
                <label><span data-i18n="oFName"></span><input id="oName" maxlength="30" required></label>
                <label><span data-i18n="oFMoveTime"></span><input id="oMoveTime" type="number" min="5" max="600" value="30" required></label>
                <label><span data-i18n="oFWin"></span><input id="oWin" type="number" min="0" max="100" value="3" required></label>
                <label><span data-i18n="oFDraw"></span><input id="oDraw" type="number" min="0" max="100" value="1" required></label>
                <label><span data-i18n="oFLoss"></span><input id="oLoss" type="number" min="0" max="100" value="0" required></label>
              </form>
              <div class="row">
                <button class="go" type="submit" form="oCreateForm" data-i18n="oCreateBtn"></button>
                <button id="oCreateCancel" class="ghost" type="button" data-i18n="cancel"></button>
              </div>
              <p class="muted" data-i18n="oCreateHint"></p>
            </div>

            <div id="oDetail" class="panel hidden">
              <div class="detail-head">
                <div class="code-box">
                  <div class="muted" data-i18n="joinCode"></div>
                  <div id="oCode" class="big-code"></div>
                </div>
                <div style="flex:1; min-width: 200px">
                  <div class="row"><span id="oDName" class="detail-title"></span><span id="oBadge" class="badge"></span></div>
                  <div id="oInfo" class="muted"></div>
                </div>
              </div>
              <ol id="oSteps" class="steps"></ol>
              <div class="next">
                <div class="next-label" data-i18n="nextLabel"></div>
                <div id="oPhase" class="next-text"></div>
                <div class="row">
                  <button id="oScheduleBtn" class="go big"></button>
                  <button id="oStartBtn" class="go big"></button>
                  <button id="oEndBtn" class="stop big"></button>
                  <button id="oReshuffleBtn" class="ghost" data-i18n="oReshuffleBtn"></button>
                  <button id="oReopenBtn" class="ghost" data-i18n="oReopenBtn"></button>
                </div>
              </div>
              <div class="row tools">
                <button id="oLinkBtn" class="ghost" data-i18n="copyJoinLink"></button>
                <button id="oCsvBtn" class="ghost" data-i18n="csv"></button>
                <span class="spacer"></span>
                <button id="oDeleteBtn" class="danger-ghost small" data-i18n="delete"></button>
              </div>

              <div id="oPlay" class="cols section">
                <div>
                  <div class="row" style="margin-bottom:8px">
                    <h2 style="margin:0" data-i18n="oGamesOf"></h2>
                    <select id="oRoundSel"></select>
                    <span id="oByeText" class="muted"></span>
                  </div>
                  <div class="scroll"><table>
                    <thead><tr><th>#</th><th data-i18n="oColBlack"></th><th data-i18n="oColWhite"></th><th class="num" data-i18n="oColMoves"></th><th data-i18n="oColState"></th><th></th></tr></thead>
                    <tbody id="oGamesBody"></tbody>
                  </table></div>
                  <p class="muted" data-i18n="oManualHint"></p>
                  <div id="oViewer" class="hidden" style="margin-top:12px">
                    <h2 id="oViewerTitle"></h2>
                    <canvas id="oViewerCv" style="width:min(100%, 440px); aspect-ratio:1; border-radius:8px; display:block"></canvas>
                  </div>
                </div>
                <div>
                  <h2 data-i18n="oStandings"></h2>
                  <div class="scroll"><table>
                    <thead><tr><th>#</th><th data-i18n="colSid"></th><th data-i18n="colName"></th><th class="num" data-i18n="oColP"></th><th class="num" data-i18n="oColW"></th><th class="num" data-i18n="oColD"></th><th class="num" data-i18n="oColL"></th><th class="num" data-i18n="oColPts"></th></tr></thead>
                    <tbody id="oStandBody"></tbody>
                  </table></div>
                  <p class="muted" data-i18n="oTieHint"></p>
                </div>
              </div>

              <details id="oMembersBox" class="box" open>
                <summary id="oMembersTitle"></summary>
                <div class="scroll"><table>
                  <thead><tr><th data-i18n="colSid"></th><th data-i18n="colName"></th><th data-i18n="oColLogin"></th><th></th></tr></thead>
                  <tbody id="oMembersBody"></tbody>
                </table></div>
              </details>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- ================= 🧱 테트리스 ================= -->
    <section class="game" data-game="tetris">
      <div data-view="rooms">
        <div class="split">
          <aside class="list-pane">
            <button id="tNewBtn" class="go new-btn" type="button" data-i18n="tNewRoom"></button>
            <div id="tCards" class="cards"></div>
            <p id="tNoRooms" class="muted" data-i18n="tNoRoomsAdmin"></p>
          </aside>
          <div>
            <div id="tEmpty" class="empty-state" data-i18n="pickHint"></div>

            <div id="tCreate" class="panel hidden">
              <h2 data-i18n="tCreateTitle"></h2>
              <form id="tCreateForm" class="form">
                <label><span data-i18n="tFName"></span><input id="tName" maxlength="20" required data-i18n-ph="tRoomNamePh"></label>
              </form>
              <div class="row">
                <button class="go" type="submit" form="tCreateForm" data-i18n="tCreateBtn"></button>
                <button id="tCreateCancel" class="ghost" type="button" data-i18n="cancel"></button>
              </div>
              <p class="muted" data-i18n="tAdminHint"></p>
            </div>

            <div id="tDetail" class="panel hidden">
              <div class="detail-head">
                <div class="code-box">
                  <div class="muted" data-i18n="joinCode"></div>
                  <div id="tCode" class="big-code"></div>
                </div>
                <div style="flex:1; min-width: 200px">
                  <div class="row"><span id="tDName" class="detail-title"></span><span id="tBadge" class="badge"></span></div>
                  <div id="tInfo" class="muted"></div>
                </div>
              </div>
              <div class="next">
                <div class="next-label" data-i18n="nextLabel"></div>
                <div id="tPhase" class="next-text"></div>
                <div class="row">
                  <button id="tStartBtn" class="go big" data-i18n="tStart"></button>
                  <button id="tStopBtn" class="stop big" data-i18n="tStop"></button>
                </div>
              </div>
              <div class="row tools">
                <button id="tLinkBtn" class="ghost" data-i18n="copyJoinLink"></button>
                <button id="tCsvBtn" class="ghost" data-i18n="csv"></button>
                <span class="spacer"></span>
                <button id="tResetBtn" class="danger-ghost small" data-i18n="tResetRoom"></button>
                <button id="tDeleteBtn" class="danger-ghost small" data-i18n="delete"></button>
              </div>

              <div class="cols section">
                <div>
                  <h2><span data-i18n="tMonitor"></span> <span id="tLobbyCount" class="muted"></span></h2>
                  <div id="tThumbs" class="t-thumbs"></div>
                </div>
                <div>
                  <h2 data-i18n="tStandings"></h2>
                  <div class="scroll"><table>
                    <thead><tr><th>#</th><th data-i18n="colSid"></th><th data-i18n="colName"></th><th class="num" data-i18n="tColPts"></th><th class="num" data-i18n="tColWins"></th><th class="num" data-i18n="colGames"></th><th class="num" data-i18n="tColSent"></th></tr></thead>
                    <tbody id="tStandBody"></tbody>
                  </table></div>
                  <p class="muted" data-i18n="tPointsHint"></p>
                  <h2 id="tLastTitle" class="section"></h2>
                  <div class="scroll"><table>
                    <thead><tr><th>#</th><th data-i18n="colName"></th><th class="num" data-i18n="tSent"></th><th class="num" data-i18n="tLines"></th><th class="num" data-i18n="tColPts"></th></tr></thead>
                    <tbody id="tLastBody"></tbody>
                  </table></div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>
</div>

<script src="i18n.js?v=20261020c"></script>
<script src="omok-i18n.js?v=20261020c"></script>
<script src="tetris-i18n.js?v=20261020d"></script>
<script src="admin-i18n.js?v=20261020c"></script>
<script src="lib/firebase-app-compat.js?v=20261020c"></script>
<script src="lib/firebase-database-compat.js?v=20261020c"></script>
<script src="lib/firebase-auth-compat.js?v=20261020c"></script>
<script src="api/config"></script>
<script src="omok-core.js?v=20261020c"></script>
<script src="tetris-common.js?v=20261020d"></script>
<script src="admin.js?v=20261020c"></script>
<script src="snake-admin.js?v=20261020c"></script>
<script src="omok-admin.js?v=20261020c"></script>
<script src="tetris-admin.js?v=20261020d"></script>
</body>
</html>
