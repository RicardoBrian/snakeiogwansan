<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>관산 게임왕 참가자 등록 포스터</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@500;700;900&display=block">
<style>
  @page { size: A4; margin: 0; }
  :root { --paper: #f4e7c8; --paper2: #e9d6a8; --ink: #2a1d12; --soft: #6b5640; --red: #c8402f; --gold: #e3b341; --green: #3e7d4f; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font-family: "Noto Sans KR", sans-serif; color: var(--ink); -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .page {
    width: 210mm; height: 297mm; padding: 12mm; position: relative; overflow: hidden;
    background: radial-gradient(ellipse at 50% 0%, #fff6dc 0%, var(--paper) 55%, var(--paper2) 100%);
  }
  .frame {
    height: 100%; border: 2.2mm solid var(--ink); border-radius: 6mm; position: relative;
    display: flex; flex-direction: column; align-items: center; padding: 8mm 12mm 9mm;
    box-shadow: inset 0 0 0 1.2mm var(--paper), inset 0 0 0 1.8mm var(--ink);
  }
  .class-badge {
    margin: 0 0 3mm; padding: .5mm 7mm 1mm; border: .9mm solid var(--ink); border-radius: 3mm;
    background: var(--red); color: #fff; font-family: "Black Han Sans", sans-serif; font-size: 26pt; line-height: 1.1;
    box-shadow: 1mm 1mm 0 var(--ink); transform: rotate(-3deg);
  }
  .kicker { margin: 0; font-weight: 700; font-size: 13pt; letter-spacing: .08em; color: var(--soft); }
  h1 {
    margin: 3mm 0 0; font-family: "Black Han Sans", sans-serif; font-weight: 400; text-align: center;
    font-size: 58pt; line-height: 1; color: var(--gold);
    text-shadow: 1.2mm 1.2mm 0 var(--red), 2.4mm 2.4mm 0 var(--ink); transform: rotate(-2deg);
  }
  .sub {
    margin: 4mm 0 0; padding: 1.5mm 7mm; border-radius: 99px; background: var(--ink); color: var(--paper);
    font-family: "Black Han Sans", sans-serif; font-size: 22pt; letter-spacing: .06em;
  }
  .hero { display: flex; align-items: center; gap: 5mm; margin: 5mm 0 0; }
  .hero svg.npc { width: 32mm; height: auto; flex: none; }
  .bubble {
    position: relative; padding: 4mm 6mm; background: #fffaf0; border: .9mm solid var(--ink); border-radius: 5mm;
    font-weight: 900; font-size: 15pt; line-height: 1.45; max-width: 92mm;
  }
  .bubble::before { content: ""; position: absolute; left: -5.2mm; top: 50%; margin-top: -3mm; border: 3mm solid transparent; border-right: 4.4mm solid var(--ink); }
  .bubble::after { content: ""; position: absolute; left: -3.6mm; top: 50%; margin-top: -2.2mm; border: 2.2mm solid transparent; border-right: 3.4mm solid #fffaf0; }
  .bubble b { color: var(--red); }
  .bubble small { display: block; font-size: 10pt; font-weight: 700; color: var(--red); }
  .parts { display: grid; grid-template-columns: 1fr 1fr; gap: 6mm; width: 100%; margin: 6mm 0 0; }
  .part { border: .9mm solid var(--ink); border-radius: 4mm; background: #fffaf0; padding: 4mm 4mm 3mm; }
  .part h2 { margin: 0 0 3mm; display: flex; align-items: baseline; gap: 2.5mm; font-family: "Black Han Sans", sans-serif; font-weight: 400; font-size: 18pt; }
  .part h2 span { font-family: "Noto Sans KR", sans-serif; font-weight: 700; font-size: 12pt; color: var(--soft); }
  .games { display: grid; grid-template-columns: 1fr 1fr; gap: 3mm; }
  .game { text-align: center; }
  .game svg { width: 100%; height: 21mm; display: block; }
  .game b { display: block; margin-top: 1.5mm; font-size: 12.5pt; font-weight: 900; }
  .game small { display: block; font-size: 9pt; color: var(--soft); font-weight: 700; }
  .meet { display: flex; align-items: center; gap: 4mm; margin: 5mm 0 0; }
  .pin { width: 9mm; height: 12mm; }
  .meet .place { font-family: "Black Han Sans", sans-serif; font-size: 28pt; color: var(--red); }
  .meet .lbl { font-weight: 700; font-size: 13pt; color: var(--soft); }
  .prize { margin: 2mm 0 0; font-weight: 900; font-size: 13pt; }
  .cta { margin-top: auto; display: flex; align-items: center; gap: 8mm; padding-top: 5mm; border-top: .6mm dashed var(--soft); width: 100%; justify-content: center; }
  .qr { width: 42mm; height: 42mm; padding: 2.5mm; background: #fffaf0; border: .9mm solid var(--ink); border-radius: 3mm; flex: none; }
  .qr svg { width: 100%; height: 100%; display: block; }
  .cta-text .go { font-family: "Black Han Sans", sans-serif; font-size: 30pt; line-height: 1.1; }
  .cta-text .go em { font-style: normal; color: var(--red); }
  .cta-text .url { margin-top: 2mm; font-weight: 900; font-size: 15pt; letter-spacing: .02em; }
  .cta-text .langs { margin-top: 2mm; font-size: 10pt; font-weight: 700; color: var(--soft); }
  .cta-text .note { margin-top: 1mm; font-size: 10pt; font-weight: 700; color: var(--soft); }
</style>
</head>
<body>
<div class="page"><div class="frame">
  <div class="class-badge">2-1</div>
  <p class="kicker">오범석 박사의 축제 탐험대 모집</p>
  <h1>관산 게임왕</h1>
  <div class="sub">참가자 등록</div>

  <div class="hero">

      <path d="M24 124 Q26 88 60 86 Q94 88 96 124Z" fill="#9b7442"/>
      <path d="M48 88 L60 104 L72 88Z" fill="#efe3c8"/>
      <path d="M44 90 Q60 100 76 90 L80 98 Q60 108 40 98Z" fill="#c8402f"/>
      <rect x="34" y="104" width="12" height="16" rx="2" fill="#7a5a32"/>
      <rect x="74" y="104" width="12" height="16" rx="2" fill="#7a5a32"/>
      <circle cx="60" cy="62" r="25" fill="#f3c99d"/>
      <circle cx="35" cy="64" r="5" fill="#eab887"/><circle cx="85" cy="64" r="5" fill="#eab887"/>
      <ellipse cx="60" cy="42" rx="44" ry="9" fill="#5e4026"/>
      <path d="M36 43 Q36 14 60 16 Q84 14 84 43Z" fill="#7a5530"/>
      <path d="M60 17 Q57 26 60 30" stroke="#5e4026" stroke-width="3" fill="none"/>
      <rect x="36.5" y="34" width="47" height="7" fill="#33241a"/>
      <path d="M43 52 L54 54 M66 54 L77 52" stroke="#4a3322" stroke-width="3" stroke-linecap="round"/>
      <circle cx="50" cy="61" r="3.2" fill="#2a1d14"/>
      <circle cx="71" cy="61" r="8" fill="rgba(200,230,255,.35)" stroke="#c9a227" stroke-width="2.5"/>
      <circle cx="71" cy="61" r="3.2" fill="#2a1d14"/>
      <path d="M79 64 Q86 78 82 92" stroke="#c9a227" stroke-width="1.2" fill="none"/>
      <path d="M60 66 Q58 71 61 72" stroke="#c99470" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M60 75 Q50 71 40 77 Q44 81 50 79 Q56 79 60 76 Q64 79 70 79 Q76 81 80 77 Q70 71 60 75Z" fill="#4a3322"/>
      <ellipse cx="60" cy="82" rx="5" ry="2" fill="#7a2e22"/>
    </svg>
    <div class="bubble">
      <small>오범석 박사</small>
      젊은 탐험가여, 네 개의 유적이<br><b>컴퓨터실</b>에서 기다리고 있다네!
    </div>
  </div>

  <div class="parts">
    <section class="part">
      <h2>1부 <span>9:40 ~ 10:20</span></h2>
      <div class="games">
        <div class="game">
          <svg viewBox="0 0 100 70">
            <rect x="6" y="8" width="52" height="30" rx="10" fill="#e3b341" stroke="#2a1d12" stroke-width="3"/>
            <path d="M18 38 L14 50 L28 38Z" fill="#e3b341" stroke="#2a1d12" stroke-width="3" stroke-linejoin="round"/>
            <text x="32" y="30" text-anchor="middle" font-family="Black Han Sans" font-size="20" fill="#2a1d12">끝말</text>
            <rect x="42" y="30" width="52" height="30" rx="10" fill="#fffaf0" stroke="#2a1d12" stroke-width="3"/>
            <path d="M82 60 L86 68 L72 60Z" fill="#fffaf0" stroke="#2a1d12" stroke-width="3" stroke-linejoin="round"/>
            <text x="68" y="52" text-anchor="middle" font-family="Black Han Sans" font-size="20" fill="#c8402f">잇기</text>
          </svg>
          <b>끄투온라인</b><small>말의 신전</small>
        </div>
        <div class="game">
          <svg viewBox="0 0 100 70">
            <g stroke="#2a1d12" stroke-width="2.5">
              <rect x="26" y="4" width="14" height="14" fill="#9b59b6"/><rect x="40" y="4" width="14" height="14" fill="#9b59b6"/><rect x="54" y="4" width="14" height="14" fill="#9b59b6"/><rect x="40" y="18" width="14" height="14" fill="#9b59b6"/>
              <rect x="12" y="52" width="14" height="14" fill="#3e7d4f"/><rect x="26" y="52" width="14" height="14" fill="#3e7d4f"/><rect x="26" y="38" width="14" height="14" fill="#3e7d4f"/>
              <rect x="40" y="52" width="14" height="14" fill="#c8402f"/><rect x="54" y="52" width="14" height="14" fill="#c8402f"/><rect x="54" y="38" width="14" height="14" fill="#c8402f"/>
              <rect x="68" y="52" width="14" height="14" fill="#2f80c4"/><rect x="68" y="38" width="14" height="14" fill="#2f80c4"/><rect x="82" y="52" width="14" height="14" fill="#e3b341"/><rect x="82" y="38" width="14" height="14" fill="#e3b341"/>
            </g>
          </svg>
          <b>테트리스</b><small>무너지는 탑</small>
        </div>
      </div>
    </section>
    <section class="part">
      <h2>2부 <span>10:30 ~ 11:15</span></h2>
      <div class="games">
        <div class="game">
          <svg viewBox="0 0 100 70">
            <rect x="15" y="2" width="70" height="66" rx="4" fill="#d9a85b" stroke="#2a1d12" stroke-width="3"/>
            <g stroke="#7a5530" stroke-width="1.5">
              <path d="M15 15H85M15 28H85M15 41H85M15 54H85M28 2V68M41 2V68M54 2V68M67 2V68"/>
            </g>
            <g stroke="#2a1d12" stroke-width="1.5">
              <circle cx="28" cy="54" r="5.5" fill="#2a1d12"/><circle cx="41" cy="41" r="5.5" fill="#2a1d12"/><circle cx="54" cy="28" r="5.5" fill="#2a1d12"/><circle cx="67" cy="15" r="5.5" fill="#2a1d12"/>
              <circle cx="54" cy="41" r="5.5" fill="#fffaf0"/><circle cx="67" cy="41" r="5.5" fill="#fffaf0"/><circle cx="41" cy="28" r="5.5" fill="#fffaf0"/>
            </g>
          </svg>
          <b>오목</b><small>돌의 미궁</small>
        </div>
        <div class="game">
          <svg viewBox="0 0 100 70">
            <path d="M10 52 C22 30, 34 30, 44 46 S66 62, 76 40" fill="none" stroke="#2a1d12" stroke-width="15" stroke-linecap="round"/>
            <path d="M10 52 C22 30, 34 30, 44 46 S66 62, 76 40" fill="none" stroke="#3e7d4f" stroke-width="10" stroke-linecap="round"/>
            <path d="M10 52 C22 30, 34 30, 44 46 S66 62, 76 40" fill="none" stroke="#e3b341" stroke-width="10" stroke-linecap="round" stroke-dasharray="5 9"/>
            <circle cx="78" cy="36" r="10" fill="#3e7d4f" stroke="#2a1d12" stroke-width="3"/>
            <circle cx="81" cy="33" r="3" fill="#fff"/><circle cx="82" cy="33" r="1.5" fill="#2a1d12"/>
            <circle cx="92" cy="18" r="4" fill="#c8402f" stroke="#2a1d12" stroke-width="2"/>
          </svg>
          <b>지렁이 게임</b><small>뱀의 동굴</small>
        </div>
      </div>
    </section>
  </div>

  <div class="meet">
    <svg class="pin" viewBox="0 0 30 40"><path d="M15 39 C15 39 2 22 2 14 A13 13 0 0 1 28 14 C28 22 15 39 15 39Z" fill="#c8402f" stroke="#2a1d12" stroke-width="2.5"/><circle cx="15" cy="14" r="5" fill="#fffaf0"/></svg>
    <div><div class="lbl">집결지</div><div class="place">컴퓨터실</div></div>
  </div>
  <p class="prize">🏆 게임에서 승리하고 상품을 받아가세요!</p>

  <div class="cta">
    <div class="qr"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 33 33" shape-rendering="crispEdges"><path stroke="#2a1d12" d="M0 0.5h7m2 0h1m1 0h4m1 0h5m1 0h1m1 0h1m1 0h7M0 1.5h1m5 0h1m1 0h2m1 0h1m5 0h1m1 0h1m1 0h2m3 0h1m5 0h1M0 2.5h1m1 0h3m1 0h1m1 0h2m3 0h1m1 0h5m1 0h2m1 0h1m1 0h1m1 0h3m1 0h1M0 3.5h1m1 0h3m1 0h1m1 0h1m3 0h1m2 0h1m1 0h8m1 0h1m1 0h3m1 0h1M0 4.5h1m1 0h3m1 0h1m1 0h1m1 0h1m3 0h4m1 0h6m1 0h1m1 0h3m1 0h1M0 5.5h1m5 0h1m1 0h1m1 0h4m1 0h2m2 0h1m1 0h1m2 0h1m1 0h1m5 0h1M0 6.5h7m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h7M9 7.5h2m2 0h1m1 0h2m1 0h1m1 0h1m1 0h1M2 8.5h1m2 0h4m1 0h1m2 0h1m1 0h2m1 0h2m2 0h2m1 0h1m1 0h5M2 9.5h2m1 0h1m3 0h1m1 0h1m1 0h1m1 0h2m2 0h3m1 0h5m1 0h1m1 0h2M2 10.5h1m1 0h3m1 0h2m1 0h1m2 0h2m2 0h3m2 0h1m3 0h2m1 0h1m1 0h1M0 11.5h1m2 0h1m1 0h1m1 0h1m1 0h2m2 0h3m2 0h1m2 0h1m2 0h1m1 0h2m3 0h2M0 12.5h5m1 0h2m1 0h1m1 0h1m3 0h3m3 0h1m1 0h2m1 0h4m2 0h1M0 13.5h4m3 0h1m1 0h1m1 0h5m3 0h3m1 0h7m2 0h1M0 14.5h1m1 0h1m1 0h1m1 0h1m2 0h1m1 0h1m1 0h5m1 0h1m3 0h1m1 0h3m2 0h1m1 0h1M3 15.5h1m1 0h1m1 0h5m6 0h3m1 0h1m2 0h1m1 0h3M0 16.5h2m1 0h4m1 0h4m1 0h1m2 0h1m2 0h2m1 0h2m2 0h2M3 17.5h3m1 0h2m2 0h1m3 0h1m1 0h5m1 0h1m2 0h2m2 0h1m1 0h1M1 18.5h1m3 0h7m4 0h1m1 0h1m3 0h2m1 0h6m1 0h1M1 19.5h1m1 0h3m1 0h1m2 0h2m1 0h3m1 0h2m4 0h1m1 0h1m3 0h1M0 20.5h5m1 0h1m1 0h2m3 0h1m2 0h2m2 0h1m2 0h5m4 0h1M1 21.5h1m2 0h2m3 0h3m2 0h1m1 0h1m1 0h4m2 0h2m1 0h1m1 0h1m2 0h1M0 22.5h2m1 0h6m3 0h2m2 0h1m2 0h2m3 0h3m1 0h1m3 0h1M7 23.5h1m4 0h1m1 0h1m1 0h1m2 0h2m2 0h2m4 0h1m1 0h1M0 24.5h2m1 0h8m6 0h4m3 0h6m1 0h2M8 25.5h2m3 0h2m1 0h2m6 0h1m3 0h3m1 0h1M0 26.5h7m1 0h1m2 0h1m1 0h1m3 0h3m1 0h2m1 0h1m1 0h1m1 0h2m2 0h1M0 27.5h1m5 0h1m1 0h2m1 0h1m1 0h1m4 0h1m3 0h3m3 0h2m1 0h2M0 28.5h1m1 0h3m1 0h1m3 0h1m1 0h1m1 0h1m1 0h2m1 0h1m1 0h8M0 29.5h1m1 0h3m1 0h1m3 0h1m1 0h2m5 0h7m1 0h3m1 0h1M0 30.5h1m1 0h3m1 0h1m1 0h2m1 0h1m1 0h5m1 0h1m2 0h1m1 0h1m3 0h2m1 0h2M0 31.5h1m5 0h1m2 0h2m1 0h3m1 0h1m2 0h1m2 0h1m1 0h1M0 32.5h7m2 0h1m1 0h2m3 0h5m3 0h1m3 0h3m1 0h1"/></svg>
</div>
    <div class="cta-text">
      <div class="go">QR 찍고<br><em>지금 신청!</em></div>
      <div class="url">gwansanjae.pages.dev</div>
      <div class="langs">한국어 · English · 中文 · Русский</div>
      <div class="note">신청한 학생만 참여 · 선정 결과는 축제 당일 아침</div>
    </div>
  </div>
</div></div>
</body>
</html>
