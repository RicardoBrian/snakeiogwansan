<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b2118">
<title>관산 게임왕 참가자 등록</title>
<meta name="description" content="관산 게임왕 참가 신청 · 선정 결과 확인 — 집결지는 컴퓨터실!">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <span class="topbar-title" data-i18n="appTitle">관산 게임왕 참가자 등록</span>
  <span class="place-chip">📍 <b data-i18n="place">컴퓨터실</b></span>
  <label class="lang-select">
    <span class="sr-only">Language</span>
    <select id="langSelect" aria-label="Language / 언어"></select>
  </label>
  <button type="button" id="muteBtn" class="icon-btn" aria-pressed="false" aria-label="배경음악 끄기">🔊</button>
</header>

<main id="app">
  <!-- 시작 화면 -->
  <section id="titleScreen" class="title-screen">
    <p class="title-kicker" data-i18n="kicker"></p>
    <h1 class="title-logo" data-i18n-html="logoHtml"></h1>
    <div class="title-npc" aria-hidden="true"></div>
    <p class="title-place">📍 <span data-i18n="meet"></span>: <b data-i18n="place"></b></p>
    <p class="title-prize">🏆 <span data-i18n="prize"></span></p>
    <div class="title-actions">
      <button type="button" id="startBtn" class="btn btn-big" data-i18n="start"></button>
      <button type="button" id="resultBtn" class="btn btn-ghost btn-result" data-i18n="results"></button>
    </div>
    <div class="lang-chips" id="langChips" role="group" aria-label="Language / 언어"></div>
    <p class="title-note" data-i18n="soundNote"></p>
  </section>

  <!-- 대화형 진행 -->
  <section id="stage" class="stage" hidden>
    <ol class="progress" id="progress"></ol>

    <div class="npc-row">
      <div class="npc" id="npc" aria-hidden="true"></div>
      <div class="bubble" id="bubble" tabindex="0" role="button">
        <p class="speaker" data-i18n="speaker"></p>
        <p class="line" id="line" aria-hidden="true"></p>
        <span class="next-hint" id="nextHint" aria-hidden="true">▼</span>
      </div>
    </div>
    <p class="sr-only" id="lineSr" aria-live="polite"></p>
    <p class="tap-hint" id="tapHint" data-i18n="tapHint"></p>

    <div id="panel" class="panel" tabindex="-1"></div>
  </section>
</main>

<!-- 신청 연출: 바위 + 도장 -->
<div id="fx" class="fx" hidden role="dialog" aria-modal="true">
  <div class="fx-scene">
    <div class="fx-torch fx-torch-l" aria-hidden="true">🔥</div>
    <div class="fx-torch fx-torch-r" aria-hidden="true">🔥</div>
    <div class="fx-hero" aria-hidden="true"><span>🏃</span></div>
    <div class="fx-boulder" aria-hidden="true">
      <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="#7d7266" stroke="#3d342c" stroke-width="5"/><path d="M22 40 L40 46 L36 62 M60 20 L56 38 L72 46 M58 70 L70 62 L80 72" stroke="#3d342c" stroke-width="4" fill="none" stroke-linecap="round"/><circle cx="34" cy="28" r="6" fill="#958a7e"/></svg>
    </div>
    <div class="fx-ground" aria-hidden="true"></div>
  </div>
  <p class="fx-caption" id="fxCaption" aria-live="assertive"></p>
  <div class="stamp fx-stamp" id="fxStamp" hidden><span data-i18n-html="stampHtml"></span></div>
</div>

<audio id="bgm" src="assets/bgm.mp3" loop preload="none"></audio>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="shared.js"></script>
<script src="i18n.js"></script>
<script src="bgm.js"></script>
<script src="app.js"></script>
</body>
</html>
